
name: Publicar fuentes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión existente que deseas actualizar'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear paquetes ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path("Fonts")
          output = Path("dist")
          output.mkdir(exist_ok=True)

          families = {
              "Ayuujk": [],
              "Mutsk": [],
              "Tuki": [],
              "Tuki-Glifos": [],
          }

          if not root.is_dir():
              raise SystemExit("No existe la carpeta Fonts")

          for font in root.rglob("*"):
              if not font.is_file() or font.suffix.lower() != ".otf":
                  continue

              name = font.stem.lower().replace("-", "").replace(" ", "")

              if name.startswith("tukiglifos"):
                  family = "Tuki-Glifos"
              elif name.startswith("ayuujk"):
                  family = "Ayuujk"
              elif name.startswith("mutsk"):
                  family = "Mutsk"
              elif name.startswith("tuki"):
                  family = "Tuki"
              else:
                  continue

              families[family].append(font)

          for family, fonts in families.items():
              if not fonts:
                  raise SystemExit(f"No se encontraron fuentes para {family}")

              archive = output / f"{family}.zip"
              seen = set()

              with ZipFile(archive, "w", ZIP_DEFLATED) as zip_file:
                  for font in sorted(fonts):
                      archive_name = f"{family}/{font.name}"

                      if archive_name.lower() in seen:
                          raise SystemExit(
                              f"Archivo duplicado: {archive_name}"
                          )

                      seen.add(archive_name)
                      zip_file.write(font, arcname=archive_name)

              print(f"{archive}: {len(fonts)} fuentes")

          PY

      - name: Determinar versión
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear nueva Release
        if: steps.version.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "Fuentes Mixe $TAG" \
            --notes "Versión $TAG de Ayuujk, Mutsk, Tuki y Tuki Glifos." \
            --verify-tag

      - name: Actualizar Release existente
        if: steps.version.outputs.mode == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null || {
            echo "No existe la Release $TAG"
            exit 1
          }

          gh release upload "$TAG" dist/*.zip --clobber

          echo "Archivos actualizados en $TAG"
